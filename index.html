<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appunti LM-18 · Urbino</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <header class="hero">
    <div class="container">
      <p class="eyebrow">
        Laurea Magistrale in Informatica e Innovazione Digitale
      </p>

      <h1>
        Appunti <span>LM-18</span><br />
        Università di Urbino
      </h1>

      <p class="subtitle">
        Raccolta organizzata di lezioni, appunti, simulazioni d’esame e
        materiali extra.
      </p>

      <input
        id="search"
        type="search"
        placeholder="Cerca materia, lezione, appunto o simulazione…"
      />
    </div>
  </header>

  <main class="container">
    <div id="courses"></div>
  </main>

  <footer>
    <div class="container">
      <p>
        Sito statico su GitHub Pages · Per aggiungere materiali modifica
        <code>courses.js</code> e carica i file in <code>materiali/</code>.
      </p>
    </div>
  </footer>

  <script src="courses.js"></script>
  <script src="app.js"></script>
</body>
</html>
